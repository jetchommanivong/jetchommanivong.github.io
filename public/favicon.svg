<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jet Chommanivong">
  <!-- Tile in the site's accent violet (--ink-accent) -->
  <rect width="32" height="32" rx="7.5" fill="#4A2E9E"/>
  <!--
    The J is drawn as a stroked path rather than <text>: a favicon has no access
    to the site's webfont, so type would fall back to whatever the OS supplies
    and look different on every platform.
  -->
  <path d="M22.5 8 V17.5 A6.5 6.5 0 0 1 9.5 17.5"
        fill="none" stroke="#F2EFE7" stroke-width="4.5" stroke-linecap="round"/>
</svg>
